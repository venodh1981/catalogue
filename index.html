<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-SUPER PRIVÉ - Master Fragrance Oil Catalog</title>

    <!-- PWA / WEB APP META TAGS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="B-SUPER PRIVÉ">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #0d0d0d;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --border-gold: #c5a059;
            --border-dark: #1f1f1f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER WITH PROPORTIONAL LOGO */
        .header {
            text-align: center;
            padding: 25px 0 15px;
            border-bottom: 1px solid var(--border-gold);
            margin-bottom: 15px;
        }

        .brand-logo-img {
            width: 180px;
            height: auto;
            max-width: 80%;
            display: block;
            margin: 0 auto 12px auto;
            object-fit: contain;
            mix-blend-mode: screen;
        }

        .header h2 {
            color: var(--gold-primary);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 500;
        }

        /* CONTROLS */
        .controls-container {
            position: sticky;
            top: 0;
            background-color: var(--bg-dark);
            padding: 10px 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-dark);
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            background-color: #121212;
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .search-box::placeholder {
            color: var(--text-sub);
        }

        .category-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-top: 10px;
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: #1a1a1a;
            border: 1px solid var(--border-dark);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background-color: var(--gold-primary);
            color: #000000;
            border-color: var(--gold-primary);
            font-weight: 700;
        }

        .stats-bar {
            font-size: 11px;
            color: var(--text-sub);
            padding: 12px 0 6px 2px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* CATALOG TABLE */
        .catalog-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        .catalog-table th {
            background-color: #141414;
            color: var(--gold-primary);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-gold);
        }

        .catalog-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-dark);
            font-size: 12px;
            vertical-align: middle;
        }

        .fragrance-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 13px;
        }

        .fragrance-category {
            font-size: 9px;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .family-badge {
            display: inline-block;
            background-color: #1a1a1a;
            color: var(--gold-light);
            border: 1px solid var(--border-dark);
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .profile-badge {
            display: inline-block;
            background-color: #1c1a14;
            color: var(--gold-primary);
            border: 1px solid var(--border-gold);
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .price-text {
            color: var(--gold-primary);
            font-weight: 700;
            font-size: 12px;
            text-align: right;
            white-space: nowrap;
        }

        .no-results {
            text-align: center;
            color: var(--text-sub);
            padding: 40px;
            font-size: 12px;
            display: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="B-SUPER PRIVÉ Logo" class="brand-logo-img">
        <h2>Complete Fragrance Oils Catalog</h2>
    </div>

    <div class="controls-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search real name, scent family, or category..." oninput="filterCatalog()">
        
        <div class="category-bar">
            <button class="chip active" onclick="setCategory('All', this)">All</button>
            <button class="chip" onclick="setCategory('Men', this)">Men</button>
            <button class="chip" onclick="setCategory('Women', this)">Women</button>
            <button class="chip" onclick="setCategory('Unisex', this)">Unisex</button>
            <button class="chip" onclick="setCategory('Arabian', this)">Arabian</button>
        </div>
    </div>

    <div class="stats-bar">
        <span id="resultCount">Loading oils...</span>
        <span>100% Pure Fragrance Oil</span>
    </div>

    <table class="catalog-table">
        <thead>
            <tr>
                <th style="width: 35%;">FRAGRANCE OILS</th>
                <th style="width: 25%;">FAMILY</th>
                <th style="width: 20%;">PROFILE</th>
                <th style="width: 20%; text-align: right;">PRICE</th>
            </tr>
        </thead>
        <tbody id="catalogBody"></tbody>
    </table>

    <div id="noResults" class="no-
